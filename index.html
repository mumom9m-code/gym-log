/* ============ Tokens ============ */
:root{
  --iron:#15171C; --iron-2:#1C1F26; --iron-3:#252932; --iron-4:#2F343E;
  --line:#2C313B; --line-2:#3A404C;
  --chalk:#EEEBE4; --chalk-2:#A8ADB8; --chalk-3:#6F7482;
  --y:#F2C230; --y-ink:#1A1404; --y-dim:rgba(242,194,48,.14);
  --r:#E5484D; --r-dim:rgba(229,72,77,.14);
  --b:#4C8DF6; --b-dim:rgba(76,141,246,.14);
  --g:#2FB67C; --g-dim:rgba(47,182,124,.15);
  --w:#E9E6DF;
  --steel:#8A909C;
  --rad-sheet:28px; --rad-card:20px; --rad-row:12px; --rad-btn:14px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --tab-h:64px;
  --f:'Readex',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--iron);color:var(--chalk);font-family:var(--f);font-size:16px;line-height:1.5}
body{min-height:100dvh;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;font-variation-settings:'HEXP' 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{background:var(--iron-3);border:1px solid var(--line);border-radius:var(--rad-row);padding:10px 12px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--y)}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
input::placeholder{color:var(--chalk-3)}
svg{display:block}
svg.chev{width:18px;height:18px;flex:none;color:var(--chalk-3)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
.wide{font-variation-settings:'HEXP' 70}
.hidden{display:none!important}
.muted{color:var(--chalk-2)} .faint{color:var(--chalk-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ Shell ============ */
#app{max-width:560px;margin:0 auto;padding-block:calc(var(--safe-t) + 8px) calc(var(--tab-h) + var(--safe-b) + 96px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100dvh}
.view{display:none} .view.on{display:block}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 2px 14px}
.top h1{margin:0;font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-.2px}
.top .sub{font-size:13px;color:var(--chalk-2);margin-top:2px}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--iron-2);border:1px solid var(--line);color:var(--chalk-2);flex:none}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px}

/* Tab bar */
.tabs{position:fixed;inset:auto 0 0 0;z-index:30;background:rgba(21,23,28,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--chalk-3);font-size:11px;font-weight:500}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--chalk)}
.tab.on svg{color:var(--y)}

/* ============ Day tabs ============ */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px 9px 12px;border-radius:999px;background:var(--iron-2);border:1px solid var(--line);font-size:14px;color:var(--chalk-2);white-space:nowrap}
.day i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.day.on{background:var(--chalk);color:var(--iron);border-color:var(--chalk);font-weight:600}
.day .live{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3px var(--g-dim)}

/* ============ Live session bar ============ */
.live-bar{position:sticky;top:calc(var(--safe-t) + 6px);z-index:20;display:flex;align-items:center;gap:14px;background:rgba(28,31,38,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line-2);border-radius:18px;padding:10px 10px 10px 14px;margin-bottom:12px}
.live-bar .stat{display:flex;flex-direction:column;line-height:1.15}
.live-bar .stat b{font-size:17px;font-weight:600}
.live-bar .stat span{font-size:11px;color:var(--chalk-3)}
.live-bar .grow{flex:1}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--g);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,182,124,.5)}50%{box-shadow:0 0 0 6px rgba(47,182,124,0)}}

/* ============ Buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:var(--rad-btn);font-weight:600;font-size:15px;background:var(--iron-3);border:1px solid var(--line-2);color:var(--chalk);white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn:active{transform:scale(.97)}
.btn.y{background:var(--y);color:var(--y-ink);border-color:var(--y)}
.btn.r{background:var(--r-dim);color:#FF8A8D;border-color:transparent}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4}
.row-btns{display:flex;gap:10px}
.row-btns>*{flex:1}

/* ============ Exercise card ============ */
.exc{background:var(--iron-2);border:1px solid var(--line);border-radius:var(--rad-card);margin-bottom:14px;overflow:hidden}
.exc-h{display:flex;gap:12px;padding:12px 12px 8px;align-items:center}
.exc-h .t{flex:1;min-width:0}
.exc-h h3{margin:0;font-size:17px;font-weight:600;line-height:1.3}
.exc-h .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--iron-3);color:var(--chalk-2);border:1px solid var(--line)}
.tag.y{background:var(--y-dim);color:var(--y);border-color:transparent}
.tag.r{background:var(--r-dim);color:#FF8A8D;border-color:transparent}
.tag.g{background:var(--g-dim);color:#5FD3A0;border-color:transparent}
.tag.b{background:var(--b-dim);color:#8AB4FF;border-color:transparent}
.exc .tools{display:flex;gap:6px}
.exc .tools .icon-btn{width:36px;height:36px}
.exc .tools .icon-btn svg{width:18px;height:18px}

.hint{margin:0 12px 8px;padding:9px 12px;border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.hint svg{width:16px;height:16px;flex:none;margin-top:2px}
.hint.up{background:var(--g-dim);color:#7FE0B5}
.hint.stall{background:var(--r-dim);color:#FFB0B2}
.hint.info{background:var(--iron-3);color:var(--chalk-2)}
.hint button{color:inherit;text-decoration:underline;text-underline-offset:3px;font-size:13px}

/* Sets table (RTL: right→left: رقم، السابق، كغ، عدات، ✓) */
.sets{padding:0 8px 6px}
.srow{display:grid;grid-template-columns:38px minmax(0,1fr) 76px 64px 44px;gap:6px;align-items:center;padding:4px 4px;border-radius:12px;transition:background .2s}
.srow.head{font-size:11.5px;color:var(--chalk-3);padding-bottom:0}
.srow.head>*{text-align:center}
.srow.done{background:rgba(47,182,124,.10)}
.sno{height:34px;border-radius:10px;display:grid;place-items:center;font-weight:600;font-size:14px;background:var(--iron-3);color:var(--chalk-2)}
.sno.w{color:var(--y)} .sno.d{color:#8AB4FF} .sno.f{color:#FF8A8D}
.prev{font-size:13px;color:var(--chalk-3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev.tap{color:var(--chalk-2)}
.srow input{height:38px;padding:0 4px;text-align:center;font-size:16px;font-weight:600;background:var(--iron-3);border-color:transparent;border-radius:10px;font-variant-numeric:tabular-nums}
.srow.done input{background:transparent;color:#BFF0D8}
.srow input::placeholder{color:#5A5F6C;font-weight:500}
.chk{width:40px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--iron-3);color:var(--chalk-3);margin-inline-start:auto}
.chk svg{width:20px;height:20px}
.srow.done .chk{background:var(--g);color:#06231A}
.chk:active{transform:scale(.9)}
.pr-mark{display:inline-block;font-size:10px;color:var(--y);margin-inline-start:4px}

.exc-f{display:flex;align-items:center;gap:8px;padding:6px 12px 12px}
.exc-f .add{color:var(--chalk-2);font-size:13.5px;display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;background:var(--iron-3)}
.exc-f .add svg{width:16px;height:16px}
.exc-f .vol{margin-inline-start:auto;font-size:12.5px;color:var(--chalk-3);text-align:left}
.exc-f .vol b{color:var(--chalk-2);font-weight:600}
.delta-up{color:#5FD3A0} .delta-dn{color:#FF8A8D}

.edit-tools{display:flex;align-items:center;gap:8px;padding:0 12px 12px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;background:var(--iron-3);border-radius:12px;border:1px solid var(--line)}
.stepper button{width:36px;height:36px;display:grid;place-items:center;color:var(--chalk-2);font-size:20px}
.stepper span{min-width:58px;text-align:center;font-size:13px}
.ex-note{margin:0 12px 10px;font-size:13px;color:var(--chalk-2);background:var(--iron-3);border-radius:10px;padding:8px 10px;display:flex;gap:8px}
.ex-note svg{width:15px;height:15px;flex:none;margin-top:3px;color:var(--y)}

/* ============ Motion demo (2-frame "gif") ============ */
.demo{position:relative;overflow:hidden;background:#1D2027;border-radius:14px;aspect-ratio:3/2}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo img.a{object-position:50% 0%}
.demo img.b{object-position:50% 100%;opacity:0}
.demo.play img.b{animation:frameB 2.6s ease-in-out infinite}
@keyframes frameB{0%,32%{opacity:0}48%,82%{opacity:1}98%,100%{opacity:0}}
.demo.thumb{width:64px;flex:none;border-radius:12px}
.demo .badge{position:absolute;bottom:8px;inset-inline-start:8px;font-size:11px;background:rgba(21,23,28,.75);padding:3px 8px;border-radius:999px;color:var(--chalk-2)}
@media (prefers-reduced-motion:reduce){.demo.play img.b{animation:none}}

/* ============ Under-list actions ============ */
.after{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.note-box textarea{min-height:76px;resize:vertical;font-size:14px;background:var(--iron-2)}
.edit-toggle{display:flex;justify-content:center;margin-top:8px}
.edit-toggle button{color:var(--chalk-3);font-size:13.5px;display:flex;gap:6px;align-items:center;padding:10px 14px}
.edit-toggle svg{width:16px;height:16px}
.empty{text-align:center;padding:40px 20px;color:var(--chalk-2)}
.empty h3{margin:12px 0 6px;color:var(--chalk);font-weight:600}

/* ============ Rest pill ============ */
.rest-pill{position:fixed;z-index:35;inset-inline-start:50%;transform:translateX(50%);bottom:calc(var(--tab-h) + var(--safe-b) + 12px);display:flex;align-items:center;gap:10px;background:var(--iron-3);border:1px solid var(--line-2);border-radius:999px;padding:6px 6px 6px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
[dir=rtl] .rest-pill{transform:translateX(50%)}
.rest-pill .ring{width:40px;height:40px}
.rest-pill b{font-size:19px;font-weight:600;min-width:52px}
.rest-pill button{height:34px;padding:0 10px;border-radius:999px;background:var(--iron-4);font-size:12.5px;color:var(--chalk-2)}
.rest-pill.over{border-color:var(--y)}
.rest-pill.over b{color:var(--y)}

/* ============ Sheets ============ */
.scrim{position:fixed;inset:0;background:rgba(5,6,8,.6);z-index:68;opacity:0;transition:opacity .25s;backdrop-filter:blur(2px)}
.scrim.on{opacity:1}
.sheet{position:fixed;inset:auto 0 0 0;z-index:69;max-width:560px;margin:0 auto;background:var(--iron-2);border-radius:var(--rad-sheet) var(--rad-sheet) 0 0;border:1px solid var(--line-2);border-bottom:0;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line-2);margin:10px auto 4px;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 18px 10px;flex:none}
.sheet .sh h2{margin:0;font-size:20px;font-weight:600}
.sheet .sb{overflow-y:auto;padding:4px 18px calc(22px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sec{margin:18px 0 8px;font-size:13px;color:var(--chalk-3);font-weight:500}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;margin-bottom:10px;font-size:14.5px;line-height:1.6}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--iron-3);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--y);margin-top:2px}
.errs{margin:0;padding:0;list-style:none}
.errs li{display:flex;gap:10px;font-size:14px;margin-bottom:8px;color:#FFC2C3;line-height:1.55}
.errs li svg{width:16px;height:16px;flex:none;margin-top:3px;color:var(--r)}
.alts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.alt{background:var(--iron-3);border:1px solid var(--line);border-radius:14px;padding:6px;text-align:start;display:flex;flex-direction:column;gap:6px}
.alt .demo{border-radius:9px}
.alt span{font-size:12.5px;line-height:1.35;padding:0 2px 2px;font-weight:500}
.alt em{font-style:normal;font-size:11px;color:var(--y);padding:0 2px 2px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv div{background:var(--iron-3);border-radius:14px;padding:10px 12px}
.kv span{display:block;font-size:12px;color:var(--chalk-3)}
.kv b{font-size:17px;font-weight:600}
.body-pair{display:flex;gap:6px;justify-content:center;background:var(--iron-3);border-radius:18px;padding:14px 8px 8px}
.body-pair svg{width:46%;max-width:170px;height:auto}
.legend{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--chalk-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

/* Menu list in sheet */
.menu{display:flex;flex-direction:column;gap:6px}
.menu button,.menu label.mi{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--iron-3);text-align:start;font-size:15px}
.menu svg{width:20px;height:20px;color:var(--chalk-2);flex:none}
.menu .r{color:#FF8A8D} .menu .r svg{color:var(--r)}
.menu .on{outline:2px solid var(--y)}

/* ============ Lists / picker ============ */
.search{position:relative;margin-bottom:10px}
.search input{padding-inline-start:40px;height:46px;background:var(--iron-2);border-radius:14px}
.search svg{position:absolute;inset-inline-start:12px;top:13px;width:20px;height:20px;color:var(--chalk-3)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--iron-2);border:1px solid var(--line);font-size:13.5px;color:var(--chalk-2);display:flex;align-items:center;gap:7px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--chalk);color:var(--iron);border-color:var(--chalk);font-weight:600}
.lib{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lcard{background:var(--iron-2);border:1px solid var(--line);border-radius:18px;padding:6px;text-align:start;display:flex;flex-direction:column}
.lcard .demo{border-radius:13px}
.lcard b{font-size:14px;font-weight:600;line-height:1.35;padding:8px 6px 0}
.lcard span{font-size:12px;color:var(--chalk-3);padding:2px 6px 6px}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;gap:12px;align-items:center;padding:6px;border-radius:14px;background:var(--iron-3);text-align:start}
.pitem .t{flex:1;min-width:0}
.pitem b{display:block;font-size:14.5px;font-weight:600}
.pitem span{font-size:12px;color:var(--chalk-3)}
.pitem .plus{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--iron-4);color:var(--y)}
.pitem .plus svg{width:18px;height:18px}

/* ============ Panels (progress/body/settings) ============ */
.panel{background:var(--iron-2);border:1px solid var(--line);border-radius:var(--rad-card);padding:16px;margin-bottom:14px}
.panel h2{margin:0;font-size:17px;font-weight:600}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.seg{display:flex;background:var(--iron-3);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 10px;border-radius:9px;font-size:12.5px;color:var(--chalk-2);white-space:nowrap}
.seg button.on{background:var(--iron);color:var(--chalk);font-weight:600;box-shadow:0 1px 0 rgba(255,255,255,.04)}

/* Week plates */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--chalk-3)}
.wplate{width:36px;height:36px;border-radius:50%;border:2px dashed var(--line-2);display:grid;place-items:center}
.wplate.on{border:0;box-shadow:inset 0 0 0 4px rgba(0,0,0,.18)}
.wplate.on::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--iron-2);box-shadow:0 0 0 3px rgba(0,0,0,.2)}
.wd.today{color:var(--chalk)}
.streak{display:flex;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.streak div{flex:1}
.streak b{display:block;font-size:22px;font-weight:600}
.streak span{font-size:12px;color:var(--chalk-3)}

/* Heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;direction:ltr;justify-content:end}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--iron-3)}
.heat i.l1{background:rgba(242,194,48,.35)} .heat i.l2{background:rgba(242,194,48,.65)} .heat i.l3{background:var(--y)}
.heat i.fut{background:transparent}

/* Chart */
.chart{position:relative;margin:4px -4px 0}
.chart svg{width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;top:0;transform:translateX(-50%);background:var(--chalk);color:var(--iron);font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px;white-space:nowrap;pointer-events:none}
.ch-empty{padding:30px 10px;text-align:center;color:var(--chalk-3);font-size:14px}
.picker-btn{display:flex;align-items:center;gap:12px;width:100%;background:var(--iron-3);border-radius:16px;padding:6px 12px 6px 6px;text-align:start;margin-bottom:12px}
.picker-btn .t{flex:1}
.picker-btn b{display:block;font-weight:600;font-size:15px}
.picker-btn span{font-size:12px;color:var(--chalk-3)}
.picker-btn svg.chev{width:18px;height:18px;color:var(--chalk-3)}
.prs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.prs div{background:var(--iron-3);border-radius:14px;padding:10px 12px}
.prs span{display:block;font-size:12px;color:var(--chalk-3)}
.prs b{font-size:18px;font-weight:600}
.prs small{font-size:11.5px;color:var(--chalk-3)}

/* Muscle bars */
.mbars{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.mbar{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;font-size:13px}
.mbar .track{height:10px;background:var(--iron-3);border-radius:9px;position:relative;overflow:hidden}
.mbar .zone{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.05);border-inline:1px dashed rgba(255,255,255,.12)}
.mbar .fill{position:absolute;top:0;bottom:0;inset-inline-start:0;border-radius:9px}
.mbar b{text-align:left;font-weight:600}
.mnote{font-size:12px;color:var(--chalk-3);margin-top:10px}

/* History list */
.hist{display:flex;flex-direction:column}
.hitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-align:start;width:100%}
.hitem:last-child{border-bottom:0}
.hdate{width:46px;flex:none;text-align:center;line-height:1.1}
.hdate b{display:block;font-size:20px;font-weight:600}
.hdate span{font-size:11px;color:var(--chalk-3)}
.hitem .t{flex:1;min-width:0}
.hitem .t b{font-size:15px;font-weight:600}
.hitem .t div{font-size:12.5px;color:var(--chalk-3)}

/* Body */
.bnow{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.bbig{grid-row:span 2;background:var(--iron-3);border-radius:18px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.bbig span{font-size:12.5px;color:var(--chalk-3)}
.bbig b{font-size:44px;font-weight:600;line-height:1;letter-spacing:-.5px}
.bbig b small{font-size:16px;color:var(--chalk-2);font-weight:500;margin-inline-start:4px}
.bsm{background:var(--iron-3);border-radius:18px;padding:12px 14px}
.bsm span{display:block;font-size:12px;color:var(--chalk-3)}
.bsm b{font-size:20px;font-weight:600}
.delta{font-size:12px;font-weight:500}
.age{font-size:12.5px;color:var(--chalk-2);margin-top:10px;display:flex;gap:6px;align-items:center}
.age svg{width:14px;height:14px}
.rate{display:flex;gap:10px;margin-top:12px}
.rate div{flex:1;background:var(--iron-3);border-radius:14px;padding:10px 12px}
.rate span{display:block;font-size:12px;color:var(--chalk-3)}
.rate b{font-size:16px;font-weight:600}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--chalk-2)}
.form label.full{grid-column:1/-1}

/* Settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .t b{display:block;font-size:15px;font-weight:500}
.set-row .t span{font-size:12.5px;color:var(--chalk-3)}
.switch{width:50px;height:30px;border-radius:999px;background:var(--iron-4);position:relative;flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--chalk);transition:transform .2s}
.switch.on{background:var(--g)}
.switch.on::after{transform:translateX(-20px)}
.progs{display:flex;flex-direction:column;gap:8px}
.prog{display:flex;gap:12px;align-items:center;background:var(--iron-3);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:start}
.prog.on{border-color:var(--y);background:linear-gradient(0deg,var(--y-dim),var(--y-dim)),var(--iron-3)}
.prog .t{flex:1}
.prog b{display:block;font-weight:600}
.prog span{font-size:12.5px;color:var(--chalk-3)}
.prog .dots{display:flex;gap:3px}
.prog .dots i{width:8px;height:8px;border-radius:50%}

/* ============ Plate calculator ============ */
.bar-viz{background:var(--iron-3);border-radius:18px;padding:22px 8px;overflow:hidden;direction:ltr}
.bar-viz svg{width:100%;height:auto}
.plate-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.plate-list span{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--iron-3);padding:6px 10px;border-radius:999px}
.plate-list i{width:12px;height:12px;border-radius:50%}
.big-in{display:flex;align-items:center;gap:10px;justify-content:center;margin:14px 0}
.big-in input{width:130px;text-align:center;font-size:30px;font-weight:600;height:58px}
.big-in button{width:52px;height:52px;border-radius:50%;background:var(--iron-3);font-size:24px}

/* ============ Focus mode ============ */
.focus{position:fixed;inset:0;z-index:60;background:var(--iron);display:flex;flex-direction:column;padding:calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 14px);transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.focus.on{transform:none}

.focus>*{position:relative}
.f-top{display:flex;align-items:center;gap:10px}
.f-top .t{flex:1;min-width:0}
.f-top .t div{font-size:12.5px;color:var(--chalk-3)}
.f-top .t b{font-size:18px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-dots{display:flex;gap:5px;margin:12px 0 0}
.f-dots i{flex:1;height:4px;border-radius:4px;background:var(--iron-3)}
.f-dots i.done{background:var(--g)} .f-dots i.cur{background:var(--y)}
.f-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:0}
.f-demo{max-height:28dvh;aspect-ratio:3/2;margin:0 auto;width:100%;max-width:400px}
.f-val{display:flex;align-items:center;justify-content:space-between;gap:10px}
.f-val .lbl{font-size:13px;color:var(--chalk-3);text-align:center;margin-top:-4px}
.f-val .n{flex:1;text-align:center;font-size:clamp(52px,17vw,84px);font-weight:600;line-height:1;font-variation-settings:'HEXP' 90;letter-spacing:-1px}
.f-val .n input{all:unset;width:100%;text-align:center;font-variant-numeric:tabular-nums}
.f-val button{width:64px;height:64px;border-radius:50%;background:var(--iron-2);border:1px solid var(--line-2);font-size:30px;display:grid;place-items:center;flex:none}
.f-val button:active{background:var(--iron-3);transform:scale(.94)}
.f-prev{text-align:center;font-size:13px;color:var(--chalk-3)}
.f-done{height:68px;border-radius:22px;background:var(--y);color:var(--y-ink);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;flex:none}
.f-done svg{width:24px;height:24px}
.f-done:active{transform:scale(.98)}
.f-sub{display:flex;justify-content:space-between;margin-top:10px;gap:8px}
.f-sub button{font-size:13px;color:var(--chalk-2);padding:8px 10px;border-radius:10px;background:var(--iron-2)}

/* rest screen inside focus */
.f-rest{position:absolute;inset:0;background:var(--iron);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(var(--safe-t) + 20px) 20px calc(var(--safe-b) + 20px);z-index:2}
.plate-ring{width:min(78vw,330px);aspect-ratio:1;position:relative}
.plate-ring svg{width:100%;height:100%}
.plate-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.plate-ring .c b{font-size:clamp(54px,18vw,78px);font-weight:600;line-height:1;font-variation-settings:'HEXP' 90}
.plate-ring .c span{font-size:13px;color:var(--chalk-3);margin-top:6px}
.next-up{text-align:center}
.next-up span{font-size:12.5px;color:var(--chalk-3)}
.next-up b{display:block;font-size:18px;font-weight:600;margin-top:2px}
.rest-ctl{display:flex;gap:10px}
.rest-ctl button{height:48px;padding:0 18px;border-radius:14px;background:var(--iron-2);border:1px solid var(--line-2);font-weight:600}
.rest-ctl button.y{background:var(--y);color:var(--y-ink);border-color:var(--y)}

/* video */
.vid{border-radius:16px;overflow:hidden;background:#000;position:relative;aspect-ratio:16/9;flex:none;margin-top:10px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .lock{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:8px;background:transparent}
.vid .lock span{font-size:12px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:999px;color:var(--chalk-2)}
.vlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.vitem{display:flex;gap:10px;align-items:center;background:var(--iron-3);border-radius:12px;padding:6px;text-align:start}
.vitem img{width:72px;height:40px;object-fit:cover;border-radius:8px;flex:none}
.vitem span{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vitem button{color:var(--chalk-3);width:30px;height:30px;display:grid;place-items:center}
.vitem button svg{width:16px;height:16px}

/* ============ Finish summary ============ */
.sum-hero{text-align:center;padding:10px 0 4px}
.sum-hero .medal{width:84px;height:84px;margin:0 auto 10px}
.sum-hero h2{margin:0;font-size:24px}
.sum-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.sum-stats div{background:var(--iron-3);border-radius:14px;padding:10px;text-align:center}
.sum-stats b{display:block;font-size:20px;font-weight:600}
.sum-stats span{font-size:12px;color:var(--chalk-3)}
.pr-list{display:flex;flex-direction:column;gap:6px}
.pr-item{display:flex;gap:10px;align-items:center;background:var(--y-dim);border-radius:14px;padding:10px 12px}
.pr-item svg{width:20px;height:20px;color:var(--y);flex:none}
.pr-item b{font-size:14px;font-weight:600}
.pr-item span{font-size:12.5px;color:var(--chalk-2);display:block}

/* toast */
.toast{position:fixed;z-index:80;left:50%;top:calc(var(--safe-t) + 14px);transform:translate(-50%,-140%);background:var(--chalk);color:var(--iron);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{transform:translate(-50%,0)}

/* popover menu for set number */
.pop{position:fixed;z-index:75;background:var(--iron-3);border:1px solid var(--line-2);border-radius:16px;padding:6px;min-width:190px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.pop button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;text-align:start;font-size:14.5px}
.pop button:active{background:var(--iron-4)}
.pop button .sno{width:28px;height:28px;font-size:12px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.pop .r{color:#FF8A8D}

/* welcome */
.welcome{padding-top:24px}
.welcome .mark{width:76px;height:76px;margin-bottom:18px}
.welcome h1{font-size:32px;line-height:1.2;margin:0 0 8px;font-weight:600}
.welcome p{color:var(--chalk-2);margin:0 0 22px;font-size:15.5px;line-height:1.7}
.opt-row{display:flex;gap:8px;margin-bottom:12px}
.opt-row button{flex:1;padding:12px;border-radius:14px;background:var(--iron-2);border:1px solid var(--line);font-weight:500}
.opt-row button.on{border-color:var(--y);color:var(--y);background:var(--y-dim)}
.flab{font-size:13px;color:var(--chalk-3);margin:16px 0 8px}

/* print */
#print{display:none}
@media print{
  body{background:#fff;color:#111}
  #app,.tabs,.rest-pill,.sheet,.scrim,.focus,.toast{display:none!important}
  #print{display:block;font-family:var(--f);color:#111;direction:rtl}
  #print h1{font-size:20px;margin:0 0 4px}
  #print h2{font-size:15px;margin:18px 0 6px;border-bottom:2px solid #F2C230;padding-bottom:4px}
  #print table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:8px}
  #print th,#print td{border:1px solid #ccc;padding:4px 6px;text-align:right}
  #print th{background:#f3f3f3}
  .pbreak{page-break-inside:avoid}
}

function bodySVG(view, fill){
  const S = BODY.sil, parts = BODY[view];

    for (const d of parts[m]) mus += `<path d="${d}" fill="${c}"/><path d="${d}" fill="${c}" transform="${MIRROR}"/>`;
  }

    ? '<path d="M60,70 V117 M51.5,82 H68.5 M51,93 H69 M51.5,104 H68.5" stroke="#262A33" stroke-width="1.1" fill="none"/>'
    : '<path d="M60,30 V120" stroke="#262A33" stroke-width="1" fill="none"/>';

}

/* ================= التخزين ================= */
const store = (() => {
  const P = 'gymlog:'; let ok = true; const mem = {};
  try { const k = P + '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); } catch (e) { ok = false; }
  return {
    ok: () => ok,
    get(k, d) {
      try { const v = ok ? localStorage.getItem(P + k) : mem[k]; return v == null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set(k, v) {
      const s = JSON.stringify(v);
      if (ok) { try { localStorage.setItem(P + k, s); return; } catch (e) { ok = false; } }
      mem[k] = s;
    },
    del(k) { try { ok ? localStorage.removeItem(P + k) : delete mem[k]; } catch (e) {} },
    keys() { try { return ok ? Object.keys(localStorage).filter(k => k.startsWith(P)).map(k => k.slice(P.length)) : Object.keys(mem); } catch (e) { return []; } }
  };
})();

/* ================= حماية بيانات النسخة القديمة =================
   نفس البادئة gymlog: — أي بيانات بشكل مختلف تنحفظ كما هي تحت legacy- ولا تنمسح */
(function sanitize() {
  const keep = (k, raw) => { if (raw != null && store.get('legacy-' + k, null) == null) store.set('legacy-' + k, raw); };
  const okSess = s => s && typeof s.start === 'number' && Array.isArray(s.items) && s.items.every(it => it && typeof it.ex === 'string' && Array.isArray(it.sets));
  if (!Array.isArray(S.sessions) || !S.sessions.every(okSess)) { keep('sessions', S.sessions); S.sessions = Array.isArray(S.sessions) ? S.sessions.filter(okSess) : []; store.set('sessions', S.sessions); }
  const okBody = b => b && typeof b.d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(b.d) && typeof b.w === 'number';
  if (!Array.isArray(S.body) || !S.body.every(okBody)) { keep('body', S.body); S.body = Array.isArray(S.body) ? S.body.filter(okBody) : []; store.set('body', S.body); }
  const okPlan = p => p && typeof p.name === 'string' && Array.isArray(p.days) && p.days.length && p.days.every(d => d && Array.isArray(d.items) && d.items.every(it => it && it.u && typeof it.ex === 'string' && it.sets > 0));
  if (S.plan && !okPlan(S.plan)) { keep('plan', S.plan); S.plan = null; }
  if (S.plan) S.plan.days.forEach(d => d.items = d.items.filter(it => EX.some(e => e.id === it.ex)));
  if (!S.drafts || typeof S.drafts !== 'object' || Array.isArray(S.drafts)) S.drafts = {};
  for (const k in S.drafts) { const d = S.drafts[k]; if (!d || !Array.isArray(d.items)) delete S.drafts[k]; }
  if (!S.notes || typeof S.notes !== 'object' || Array.isArray(S.notes)) { keep('notes', S.notes); S.notes = {}; }
  if (!Array.isArray(S.videos) || !S.videos.every(v => v && typeof v.id === 'string')) { keep('videos', S.videos); S.videos = Array.isArray(S.videos) ? S.videos.filter(v => v && typeof v.id === 'string') : []; }
  if (S.timer && typeof S.timer.end !== 'number') S.timer = null;
  const st = S.settings; if (typeof st.rest !== 'number' || st.rest < 15 || st.rest > 600) st.rest = 90;
  if (!['m', 'f'].includes(st.sex)) st.sex = 'm'; if (!['beg', 'mid', 'adv'].includes(st.level)) st.level = 'mid';
  // مستخدم قديم عنده بيانات؟ لا نعرض له شاشة الترحيب من جديد
  if (!st.onboarded && (S.sessions.length || store.keys().some(k => k.startsWith('legacy-')))) st.onboarded = true;
})();

let sheetOpen = false, sheetCtx = null, IGNORE_POP = false;
function openSheet(title, body, opts = {}) {
  const sh = $('#sheet'), sc = $('#scrim');
  sh.innerHTML = `<div class="grab" data-a="sheet-close"></div><div class="sh"><h2>${title}</h2><button class="icon-btn" data-a="sheet-close" aria-label="إغلاق">${ic('x')}</button></div><div class="sb">${body}</div>`;
  sheetCtx = opts.ctx || null;
  sc.classList.remove('hidden'); sh.classList.remove('hidden');
  requestAnimationFrame(() => { sc.classList.add('on'); sh.classList.add('on'); });
  if (!sheetOpen) { try { history.pushState({ sheet: 1 }, ''); } catch (e) {} }
  sheetOpen = true;
  return sh;
}
function closeSheet(fromPop) {
  if (!sheetOpen) return;
  const sh = $('#sheet'), sc = $('#scrim');
  sh.classList.remove('on'); sc.classList.remove('on'); sheetOpen = false; sheetCtx = null;
  setTimeout(() => { if (!sheetOpen) { sh.classList.add('hidden'); sc.classList.add('hidden'); sh.innerHTML = ''; } }, 320);
  if (!fromPop) { try { if (history.state?.sheet) { IGNORE_POP = true; history.back(); } } catch (e) {} }
}

let ASK = null;
function ask(title, msg, yes, fn, danger = true) {

  openSheet(title, `<div class="mnote" style="margin:0 0 16px;font-size:14.5px;color:var(--chalk-2);line-height:1.7">${msg}</div><div class="row-btns"><button class="btn ghost" data-a="sheet-close">إلغاء</button><button class="btn ${danger ? 'r' : 'y'}" data-a="ask-yes">${yes}</button></div>`);
}
function closePop() { $('#pop')?.remove(); }
function pop(anchor, html) {
  closePop();
  const p = document.createElement('div'); p.className = 'pop'; p.id = 'pop'; p.innerHTML = html; document.body.appendChild(p);
  const r = anchor.getBoundingClientRect(), pr = p.getBoundingClientRect();
  let top = r.bottom + 6; if (top + pr.height > innerHeight - 10) top = r.top - pr.height - 6;
  let right = innerWidth - r.right; if (right + pr.width > innerWidth - 8) right = innerWidth - pr.width - 8;
  p.style.top = Math.max(8, top) + 'px'; p.style.right = Math.max(8, right) + 'px';
}

/* ================= رسم بياني زمني ================= */
const CH = {}; // id → {pts, fmt}
function lineChart(id, pts, o = {}) {
  if (pts.length < 2) return `<div class="ch-empty">${pts.length ? 'سجّل جلسة ثانية عشان يطلع الخط' : (o.empty || 'ما فيه بيانات بعد')}</div>`;
  const W = 340, H = 170, pl = 6, pr = 34, pt = 22, pb = 24;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t, span = Math.max(t1 - t0, DAY);
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  const pad = (hi - lo) * .18 || Math.max(1, hi * .05); lo -= pad; hi += pad;

function weekStart(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); } // الأحد
function progressView() {

  // الأسبوع
  const ws = weekStart(Date.now()), byDay = {};

  let week = '';

  }

  let streak = 0; { let w = ws; const wk = new Set(ss.map(s => weekStart(s.start))); if (!wk.has(w)) w -= 7 * DAY; while (wk.has(w)) { streak++; w -= 7 * DAY; } }
  const thisWeek = ss.filter(s => s.start >= ws).length;

let AC = null;

  [0, .22, .44].forEach((o, i) => { const g = AC.createGain(), os = AC.createOscillator(); os.type = 'sine'; os.frequency.value = i === 2 ? 1175 : 880; g.gain.setValueAtTime(0, t + o); g.gain.linearRampToValueAtTime(.35, t + o + .02); g.gain.exponentialRampToValueAtTime(.001, t + o + .18); os.connect(g).connect(AC.destination); os.start(t + o); os.stop(t + o + .2); });
}
function startRest(sec, next) {

}

const remain = () => S.timer ? S.timer.end - Date.now() : 0;

}

  const rm = remain(), over = rm <= 0;

  p.innerHTML = `<div class="ring">${ringSVG(over ? 0 : rm / S.timer.total, 40)}</div><b class="num">${over ? '+' + fmtDur(-rm) : fmtDur(rm + 999)}</b><button data-a="rest-add" data-s="-15">−15</button><button data-a="rest-add" data-s="15">+15</button><button data-a="rest-skip">${over ? 'تم' : 'تخطي'}</button>`;
}
function tick() {
  // المدة المنقضية في شريط الجلسة

  if (!S.timer) return;
  const rm = remain();
  if (rm <= 0 && !S.timer.fired) {
    S.timer.fired = true; save.timer(); beep();

    if (arc) { const C = 2 * Math.PI * 42; arc.setAttribute('stroke-dasharray', `${(C * clamp(rm / S.timer.total, 0, 1)).toFixed(2)} ${C.toFixed(2)}`); }

setInterval(tick, 250);

/* ================= حاسبة الأقراص ================= */
const PLATES = [[25, '#E5484D', 100, 15], [20, '#4C8DF6', 100, 13], [15, '#F2C230', 92, 12], [10, '#2FB67C', 84, 10], [5, '#E9E6DF', 62, 8], [2.5, '#E5484D', 48, 6], [1.25, '#B8BDC7', 40, 5]];
let PC = { t: 60, bar: 20 };
function platesFor(t, bar) { let side = (t - bar) / 2; const out = []; if (side < 0) return { out, left: side * 2 }; for (const p of PLATES) { while (side >= p[0] - 1e-6) { out.push(p); side -= p[0]; } } return { out, left: side * 2 }; }
function plateViz() {
  const { out, left } = platesFor(PC.t, PC.bar);
  const W = 340, H = 120, cy = H / 2, inL = 96, inR = W - 96;
  // البار: المقبض في الوسط، والأكمام على الطرفين
  let g = `<rect x="${inL}" y="${cy - 3}" width="${inR - inL}" height="6" rx="3" fill="#8A909C"/>
    <rect x="6" y="${cy - 5}" width="${inL - 6}" height="10" rx="3" fill="#A8ADB8"/><rect x="${inR}" y="${cy - 5}" width="${W - 6 - inR}" height="10" rx="3" fill="#A8ADB8"/>
    <rect x="${inL - 4}" y="${cy - 13}" width="8" height="26" rx="2" fill="#C9CDD5"/><rect x="${inR - 4}" y="${cy - 13}" width="8" height="26" rx="2" fill="#C9CDD5"/>`;
  const side = dir => { let x = dir > 0 ? inR + 5 : inL - 5, s = ''; for (const p of out) { const w = p[3] * .95, h = p[2] * 1.05; s += `<rect x="${dir > 0 ? x : x - w}" y="${cy - h / 2}" width="${w}" height="${h}" rx="2.5" fill="${p[1]}" stroke="rgba(0,0,0,.3)" stroke-width="1"/>`; x += dir * (w + 1.2); } return s; };
  g += side(1) + side(-1);
  const counts = {}; out.forEach(p => counts[p[0]] = (counts[p[0]] || 0) + 1);
  return `<div class="bar-viz"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>
  <div class="plate-list">${Object.keys(counts).sort((a, b) => b - a).map(k => { const p = PLATES.find(x => x[0] == k); return `<span class="num"><i style="background:${p[1]}"></i>${counts[k]} × ${kg(+k)} كغ</span>`; }).join('') || '<span>البار فقط</span>'}</div>
  <div class="mnote" style="text-align:center">${out.length ? 'العدد لكل جهة من البار' : ''}${Math.abs(left) > .01 ? ` — يبقى ${kg(Math.abs(left))} كغ ما ينقسم على الأقراص` : ''}</div>`;
}
function platesSheet(w) {
  PC.t = w || PC.t;
  openSheet('حاسبة الأقراص', `<div class="big-in"><button data-a="pc-step" data-d="2.5">+</button><input id="pc-t" class="num" inputmode="decimal" value="${PC.t}"><button data-a="pc-step" data-d="-2.5">−</button></div>
  <div class="seg" style="margin-bottom:14px">${[20, 15, 10].map(b => `<button class="${PC.bar === b ? 'on' : ''}" data-a="pc-bar" data-b="${b}">بار ${b} كغ</button>`).join('')}</div>
  <div id="pc-viz">${plateViz()}</div>`);

  const d = draft(), it = d.items[i];
  if (it.sets.some(s => s.t === 'w')) { toast('فيه إحماء مضاف'); return; }
  it.sets.unshift({ w: null, r: null, t: 'w', done: false }, { w: null, r: null, t: 'w', done: false }, { w: null, r: null, t: 'w', done: false });
  save.drafts(); closeSheet(); refreshCard(i); toast('أضفنا 3 مجموعات إحماء: 40٪ و60٪ و80٪');
}

function finish() {
  const di = S.ui.day, d = draft(di);

const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);

      save.drafts(); render(); toast(n ? `عبّينا ${n} مجموعة من آخر جلسة` : 'ما فيه جلسة سابقة لهالتمارين'); break;
    }
    case 'reset-day': ask('تصفير اليوم', 'نمسح مجموعات اليوم غير المحفوظة. سجلّك المحفوظ ما يتأثر.', 'صفّر', () => { delete S.drafts[S.ui.day]; save.drafts(); render(); }); break;
    case 'finish': finish(); break;
    /* تعديل البرنامج */
    case 'sets-inc': case 'sets-dec': {
      const p = pi()[i], it = d().items[i], dir = a === 'sets-inc' ? 1 : -1;
      p.sets = clamp(p.sets + dir, 1, 10);
      if (dir > 0) it.sets.push({ w: null, r: null, t: 'n', done: false });
      else { const k = it.sets.map(x => !x.done && x.t === 'n').lastIndexOf(true); if (k >= 0 && it.sets.length > 1) it.sets.splice(k, 1); }
      save.plan(); save.drafts(); refreshCard(i); break;
    }
    case 'mv-up': case 'mv-dn': {
      const j = a === 'mv-up' ? i - 1 : i + 1, P = pi(), DI = d().items; if (j < 0 || j >= P.length) break;
      [P[i], P[j]] = [P[j], P[i]]; [DI[i], DI[j]] = [DI[j], DI[i]]; save.plan(); save.drafts(); render(); break;
    }
    case 'rm-ex': { const ex = EXM[pi()[i].ex], u = pi()[i].u; ask('حذف التمرين', `نشيل «${esc(ex.n)}» من هذا اليوم. سجلّه يبقى محفوظ.`, 'احذف', () => { const k = pi().findIndex(x => x.u === u); if (k < 0) return; pi().splice(k, 1); d().items = d().items.filter(x => x.u !== u); save.plan(); save.drafts(); render(); }); break; }
    case 'add-ex': picker('add'); break;
    case 'pick': picker(D.mode, i); break;
    case 'pk-g': PK.g = D.g; $$('.sheet .chip').forEach(c => c.classList.toggle('on', c.dataset.g === D.g)); $('#pk-list').innerHTML = pickerList(); break;
    case 'pk-pick': {
      const id = D.ex;
      if (PK.mode === 'add') { pi().push({ u: uid(), ex: id, sets: 3, reps: '8-12' }); save.plan(); closeSheet(); render(); setTimeout(() => scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 80); toast('انضاف ' + EXM[id].n); }
      else if (PK.mode === 'swap') doSwap(PK.i, id);
      else { S.ui.progEx = id; save.ui(); closeSheet(); render(); }
      break;
    }
    case 'swap': doSwap(i, D.ex); break;
    /* معلومات التمرين */
    case 'ex-info': exInfo(D.ex, i); break;
    case 'ex-menu': exMenu(i); break;
    case 'stall': stallSheet(D.ex); break;
    case 'warmup': addWarmup(i); break;
    case 'plates': { const it = d().items[i], j = it.sets.findIndex(x => !x.done && x.t !== 'w'); const df = setDefaults(it, Math.max(0, j)); platesSheet(it.sets[Math.max(0, j)]?.w || df.w || 60); break; }
    case 'pc-step': PC.t = Math.max(PC.bar, (toNum($('#pc-t').value) || PC.bar) + +D.d); $('#pc-t').value = PC.t; $('#pc-viz').innerHTML = plateViz(); break;
    case 'pc-bar': PC.bar = +D.b; $$('.sheet .seg button').forEach(x => x.classList.toggle('on', +x.dataset.b === PC.bar)); $('#pc-viz').innerHTML = plateViz(); break;
    case 'ex-note': {
      const ex = EXM[D.ex];
      openSheet('ملاحظة: ' + esc(ex.n), `<textarea id="ex-note-t" style="min-height:110px" placeholder="مثال: المقعد على رقم 4، القبضة الواسعة">${esc(S.notes[ex.id] || '')}</textarea><div style="height:10px"></div><button class="btn y block" data-a="ex-note-save" data-ex="${ex.id}">${ic('check')}حفظ</button><div class="mnote">تظهر الملاحظة فوق مجموعات هالتمرين في كل الأيام.</div>`);
      break;
    }
    case 'ex-note-save': { const v = $('#ex-note-t').value.trim(); if (v) S.notes[D.ex] = v; else delete S.notes[D.ex]; save.notes(); closeSheet(); render(); break; }
    case 'ex-rest': {
      const p = pi()[i];
      openSheet('مدة الراحة', `<div class="alts" style="grid-template-columns:repeat(4,1fr)">${[45, 60, 75, 90, 120, 150, 180, 240].map(v => `<button class="btn ${restFor(p) === v ? 'y' : ''}" data-a="ex-rest-set" data-i="${i}" data-v="${v}">${v}ث</button>`).join('')}</div><div style="height:10px"></div><button class="btn ghost block" data-a="ex-rest-set" data-i="${i}" data-v="0">رجّعها للافتراضي (${S.settings.rest}ث)</button>`);
      break;
    }
    case 'ex-rest-set': { const p = pi()[i]; if (+D.v) p.rest = +D.v; else delete p.rest; save.plan(); closeSheet(); refreshCard(i); break; }
    /* الراحة */
    case 'rest-add': addRest(+D.s); if (F.on) renderFocus(); break;
    case 'rest-skip': F.resting = false; stopRest(); break;
    /* وضع التركيز */
    case 'focus': openFocus(0); break;
    case 'focus-at': closeSheet(); openFocus(i); break;
    case 'focus-close': closeFocus(); break;
    case 'f-step': { const k = D.k, el = $('#f-' + k), cur = toNum(el.value) ?? (k === 'w' ? F.w : F.r) ?? 0; const v = Math.max(0, Math.round((cur + +D.d) * 100) / 100); el.value = v; F[k] = v; buzz(8); break; }
    case 'f-done': focusDone(); break;
    case 'f-nav': {
      const dd = d(); let fi = F.i, fs = F.s + +D.d;
      if (fs < 0) { fi--; if (fi < 0) break; fs = dd.items[fi].sets.length - 1; } else if (fs >= dd.items[fi].sets.length) { fi++; if (fi >= dd.items.length) break; fs = 0; }
      F.i = fi; F.s = fs; F.resting = false; loadFocusVals(); renderFocus(); break;
    }
    case 'focus-auto': S.settings.autoNext = !S.settings.autoNext; save.settings(); renderFocus(); break;
    case 'f-vid': F.showVid = !F.showVid; renderFocus(); break;
    case 'v-lock': F.lock = !F.lock; renderFocus(); break;
    case 'v-paste': pasteVideo(); break;
    case 'video-sheet': videoSheet(); break;
    case 'v-add': { const id = addVideo($('#v-url').value); if (id) { F.vid = id; closeSheet(); if (F.on) { F.showVid = true; renderFocus(); } else openFocus(0, true); } break; }
    case 'v-play': F.vid = D.id; closeSheet(); if (F.on) { F.showVid = true; renderFocus(); } else openFocus(0, true); break;
    case 'v-del': S.videos = S.videos.filter(v => v.id !== D.id); save.videos(); if (F.vid === D.id) F.vid = null; videoSheet(); break;
    /* تطوري */
    case 'prog-ex': S.ui.progEx = D.ex; save.ui(); closeSheet(); if (F.on) closeFocus(); go('progress'); setTimeout(() => $('#ch-ex, .ch-empty')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 120); break;
    case 'prog-metric': S.ui.progMetric = D.k; save.ui(); render(); break;
    case 'range': S.ui.range = +D.k; save.ui(); render(); break;
    case 'hist-all': S.ui.histAll = true; render(); break;
    case 'sess': sessSheet(D.id); break;
    case 'sess-del': { const id = D.id; ask('حذف الجلسة', 'تنحذف الجلسة وأرقامها من السجل نهائياً.', 'احذف', () => { S.sessions = S.sessions.filter(x => x.id !== id); save.sessions(); HIST = null; render(); toast('انحذفت الجلسة'); }); break; }
    /* جسمي */
    case 'body-add': bodyForm(null); break;
    case 'body-edit': bodyForm(D.d); break;
    case 'body-metric': S.ui.bodyMetric = D.k; save.ui(); render(); break;
    case 'body-save': {
      const g = k => toNum($('#bf-' + k).value), dt = $('#bf-d').value || todayISO();
      const rec = { d: dt, w: g('w'), f: g('f'), m: g('m'), wa: g('wa') };
      if (!rec.w) { toast('الوزن مطلوب'); break; }
      if (rec.f != null && (rec.f < 2 || rec.f > 70)) { toast('نسبة الدهون غير منطقية'); break; }
      S.body = S.body.filter(b => b.d !== dt && b.d !== D.old); Object.keys(rec).forEach(k => rec[k] == null && delete rec[k]); S.body.push(rec); save.body(); closeSheet(); render(); toast('انحفظت القراءة'); break;
    }
    case 'body-del': { const dd = D.d; ask('حذف القراءة', `تنحذف قراءة ${dd}.`, 'احذف', () => { S.body = S.body.filter(b => b.d !== dd); save.body(); render(); }); break; }
    /* المكتبة */
    case 'lib-g': S.ui.libGroup = D.g; save.ui(); $$('.chips .chip').forEach(c => c.classList.toggle('on', c.dataset.g === D.g)); $('#lib-grid').innerHTML = libGrid(); break;
    /* الإعدادات */
    case 'toggle': S.settings[D.k] = !S.settings[D.k]; save.settings(); render(); break;
    case 'set-opt': S.settings[D.k] = D.v; save.settings(); render(); break;
    case 'rest-inc': case 'rest-dec': S.settings.rest = clamp(S.settings.rest + (a === 'rest-inc' ? 15 : -15), 30, 300); save.settings(); render(); break;
    case 'prog-sheet': progSheet(); break;
    case 'prog-set': {
      const id = D.id, apply = () => { S.plan = planFrom(id); S.drafts = {}; S.ui.day = 0; save.plan(); save.drafts(); save.ui(); closeSheet(); toast('صار جدولك: ' + S.plan.name); go('workout'); };
      if (liveDay() != null) ask('تغيير الجدول', 'عندك تمرين شغّال. تغيير الجدول يلغي مجموعاته غير المحفوظة.', 'غيّر الجدول', apply); else apply();
      break;
    }
    case 'export-xlsx': if (!S.sessions.length && !S.body.length) toast('ما فيه بيانات للتصدير بعد'); else exportXlsx(); break;
    case 'export-pdf': if (!S.sessions.length) toast('ما فيه جلسات للتصدير بعد'); else exportPdf(); break;
    case 'backup': backupSheet(); break;
    case 'bk-copy': { const ta = $('#bk'); ta.select(); (navigator.clipboard?.writeText(ta.value) || Promise.reject()).then(() => toast('انسخت النسخة'), () => { document.execCommand('copy'); toast('انسخت النسخة'); }); break; }
    case 'bk-dl': downloadBlob(new Blob([backupData()], { type: 'application/json' }), `gymlog-backup-${todayISO()}.json`); break;
    case 'restore': restoreSheet(); break;
    case 'rs-go': doRestore($('#rs').value); break;
    case 'offline': cacheAll(); break;
    case 'wipe': ask('مسح كل البيانات', 'تنمسح كل الجلسات والقراءات والإعدادات من هذا الجهاز. ما تقدر ترجعها إلا من نسخة احتياطية.', 'امسح الكل', () => { store.keys().forEach(k => store.del(k)); location.reload(); }); break;
    /* الترحيب */
    case 'w-opt': W[D.k] = D.v; render(); break;
    case 'w-go': {
      const w = toNum($('#w-w')?.value), f = toNum($('#w-f')?.value);
      Object.assign(S.settings, { sex: W.sex, level: W.level, onboarded: true }); save.settings();
      S.plan = planFrom(W.prog); S.drafts = {}; S.ui.day = 0; save.plan(); save.drafts();
      if (w) { S.body.push(Object.assign({ d: todayISO(), w }, f ? { f } : {})); save.body(); }
      go('workout'); break;
    }
  }
});
function doSwap(i, id) {
  const p = S.plan.days[S.ui.day].items[i], it = draft().items[i];
  if (it.sets.some(x => x.done) && !doSwap.ok) { ask('استبدال التمرين', 'هالتمرين فيه مجموعات مسجلة اليوم وبتنمسح من جلسة اليوم.', 'استبدل', () => { doSwap.ok = true; doSwap(i, id); doSwap.ok = false; }); return; }
  const old = EXM[p.ex].n; p.ex = id; it.ex = id; it.sets = it.sets.map(() => ({ w: null, r: null, t: 'n', done: false }));
  save.plan(); save.drafts(); closeSheet(); if (F.on) { loadFocusVals(); renderFocus(); } else render();
  toast(`استبدلنا ${old} بـ ${EXM[id].n}`);
}

/* إدخال القيم */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.in === 'w' || t.dataset.in === 'r') { const st = draft().items[+t.dataset.i].sets[+t.dataset.s]; st[t.dataset.in] = toNum(t.value); save.drafts(); return; }
  if (t.dataset.in === 'reps') { const i = +t.dataset.i, v = t.value.trim(); if (!/^\d+(\s*-\s*\d+)?$/.test(v)) return; S.plan.days[S.ui.day].items[i].reps = v.replace(/\s/g, ''); draft().items[i].reps = v; save.plan(); save.drafts(); return; }
  if (t.id === 'sess-note') { draft().note = t.value; save.drafts(); return; }
  if (t.id === 'pk-q') { PK.q = t.value; $('#pk-list').innerHTML = pickerList(); return; }
  if (t.id === 'lib-q') { LQ = t.value; $('#lib-grid').innerHTML = libGrid(); return; }
  if (t.id === 'pc-t') { PC.t = toNum(t.value) || 0; $('#pc-viz').innerHTML = plateViz(); return; }
  if (t.id === 'f-w') F.w = toNum(t.value); if (t.id === 'f-r') F.r = toNum(t.value);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.in === 'w' || t.dataset.in === 'r') { const st = draft().items[+t.dataset.i].sets[+t.dataset.s]; if (st.done) refreshCard(+t.dataset.i); }
  if (t.dataset.in === 'reps') refreshCard(+t.dataset.i);
  if (t.id === 'rs-file' && t.files[0]) { const r = new FileReader(); r.onload = () => { $('#rs').value = r.result; }; r.readAsText(t.files[0]); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset?.in) { e.preventDefault(); const all = $$('input[data-in="w"],input[data-in="r"]'); const k = all.indexOf(e.target); (all[k + 1] || e.target).focus(); }
  if (e.key === 'Escape') { if (sheetOpen) closeSheet(); else if (F.on) closeFocus(); }
});
document.addEventListener('focusin', e => { if (e.target.matches('.srow input') && e.target.value) e.target.select?.(); });
window.addEventListener('popstate', () => { if (IGNORE_POP) { IGNORE_POP = false; return; } if (sheetOpen) closeSheet(true); else if (F.on) closeFocus(true); });

/* ================= التشغيل ================= */
function handleShare() {
  const q = new URLSearchParams(location.search); if (!q.has('url') && !q.has('text') && !q.has('v')) return;
  const src = [q.get('url'), q.get('text'), q.get('v')].filter(Boolean).join(' ');
  const id = addVideo(src, q.get('title') || '');
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  if (id && S.settings.onboarded) { F.vid = id; S.ui.view = 'workout'; render(); setTimeout(() => openFocus(0, true), 200); }
}
render();
handleShare();
if (S.timer && remain() < -120000) stopRest();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude|claudeusercontent/.test(location.hostname)) {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

</script>
